################################################################################
# Life is Feudal: Your Own — Docker Compose
#
# Two services:
#   1. mariadb  — Database backend (required by LiF:YO)
#   2. lif-yo   — The game server (Wine + Xvfb on Linux)
#
# Usage:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f lif-yo
################################################################################

services:

  # ── MariaDB ─────────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb3
      --collation-server=utf8mb3_unicode_ci
      --innodb-file-per-table=ON
      --max-sp-recursion-depth=255
      --max-allowed-packet=10M
      --innodb-flush-log-at-trx-commit=2
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --tmp-table-size=32M
      --max-heap-table-size=32M
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootChangeme}"
      MARIADB_DATABASE:      "${DB_NAME:-lif_1}"
      MARIADB_USER:          "${DB_USER:-lif}"
      MARIADB_PASSWORD:      "${DB_PASSWORD:-changeme}"
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"               # Expose if you want external DB tools; remove for production
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Life is Feudal: Your Own ────────────────────────────────────────────────
  lif-yo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      # The server needs root-level DB privileges to create/alter tables.
      DB_HOST:          mariadb
      DB_PORT:          "3306"
      DB_USER:          root
      DB_PASSWORD:      "${DB_ROOT_PASSWORD:-rootChangeme}"
      DB_NAME:          "${DB_NAME:-lif_1}"

      # ── Server identity ──────────────────────────────────────────────────
      SERVER_NAME:      "${SERVER_NAME:-Life is Feudal Docker Server}"
      SERVER_PASSWORD:  "${SERVER_PASSWORD:-}"
      ADMIN_PASSWORD:   "${ADMIN_PASSWORD:-}"
      GAME_MODE:        "${GAME_MODE:-Sandbox}"          # Sandbox | PermaDeath
      IS_PRIVATE:       "${IS_PRIVATE:-0}"                # 1 = hidden from browser
      GAME_PORT:        "${GAME_PORT:-28000}"
      WORLD_ID:         "${WORLD_ID:-1}"
      MAX_PLAYERS:      "${MAX_PLAYERS:-64}"              # 1–64

      # ── Skills & progression ─────────────────────────────────────────────
      SKILLS_MULTIPLIER:  "${SKILLS_MULTIPLIER:-10}"      # 0.1–100  (1 = vanilla MMO)
      CRAFTING_SKILLCAP:  "${CRAFTING_SKILLCAP:-600}"     # 200–3000 (600 = vanilla)
      COMBAT_SKILLCAP:    "${COMBAT_SKILLCAP:-400}"       # 200–3000 (400 = vanilla)
      MINOR_SKILLCAP:     "${MINOR_SKILLCAP:-400}"        # 200–3000 (400 = vanilla)
      SKILL_PARENT_MODE:  "${SKILL_PARENT_MODE:-default}" # default | lowered | none

      # ── World simulation ─────────────────────────────────────────────────
      OBJECT_DECAY_RATE:    "${OBJECT_DECAY_RATE:-0}"     # 0 = no decay
      TERRAFORMING_SPEED:   "${TERRAFORMING_SPEED:-4}"    # 0.1–60  (0.8 = vanilla)
      CRAFTING_PERIOD:      "${CRAFTING_PERIOD:-60}"       # 1–3600 secs per tick
      ANIMAL_BREED_PERIOD:  "${ANIMAL_BREED_PERIOD:-60}"   # 1–600 mins between breed checks
      DAY_CYCLE:            "${DAY_CYCLE:-3}"              # 0.5–24 real hours per game day
      ANIMALS_COUNT:        "${ANIMALS_COUNT:-100}"        # 0–100 spawn points

      # ── Miscellaneous ───────────────────────────────────────────────────
      MOVABLE_MAX_DROP_HEIGHT:       "${MOVABLE_MAX_DROP_HEIGHT:-5}"
      RANDOM_EVENT_CHANCE_WALKING:   "${RANDOM_EVENT_CHANCE_WALKING:-0.03}"
      RANDOM_EVENT_CHANCE_ABILITY:   "${RANDOM_EVENT_CHANCE_ABILITY:-0.02}"
      HORSE_DECAY_MINUTES:           "${HORSE_DECAY_MINUTES:-0}"  # 0 = disabled; minutes before unattended horses vanish
      DROP_ON_PRAY:                  "${DROP_ON_PRAY:-0}"       # 1 = drop inventory on homecoming prayer

      # ── Judgement Hour (guild warfare window) ────────────────────────────
      JH_START_TIME:    "${JH_START_TIME:-00:00}"
      JH_DURATION:      "${JH_DURATION:-0}"               # duration in real-life minutes (0 = disabled)
      JH_MON:           "${JH_MON:-0}"
      JH_TUE:           "${JH_TUE:-0}"
      JH_WED:           "${JH_WED:-0}"
      JH_THU:           "${JH_THU:-0}"
      JH_FRI:           "${JH_FRI:-0}"
      JH_SAT:           "${JH_SAT:-0}"
      JH_SUN:           "${JH_SUN:-0}"

      # ── Backups ───────────────────────────────────────────────────────────
      BACKUP_ENABLED:   "${BACKUP_ENABLED:-true}"
      BACKUP_INTERVAL:  "${BACKUP_INTERVAL:-3600}"    # seconds between backups
      BACKUP_KEEP:      "${BACKUP_KEEP:-5}"            # number of backups to retain

      # ── Maintenance ──────────────────────────────────────────────────────
      UPDATE_ON_START:  "${UPDATE_ON_START:-false}"
    privileged: true
    ports:
      - "${GAME_PORT:-28000}:${GAME_PORT:-28000}/udp"
      - "${GAME_PORT:-28000}:${GAME_PORT:-28000}/tcp"
      - "${GAME_PORT_PLUS1:-28001}:${GAME_PORT_PLUS1:-28001}/udp"
      - "${GAME_PORT_PLUS1:-28001}:${GAME_PORT_PLUS1:-28001}/tcp"
      - "${GAME_PORT_PLUS2:-28002}:${GAME_PORT_PLUS2:-28002}/udp"
      - "${GAME_PORT_PLUS2:-28002}:${GAME_PORT_PLUS2:-28002}/tcp"
    volumes:
      - lif_server:/home/lif/yoserver                  # Game server files (downloaded on first run)
      - lif_wineprefix:/home/lif/.wine                 # Persist Wine prefix (avoid re-init)
      - lif_backups:/home/lif/backups                   # Hourly backups

volumes:
  mariadb_data:
  lif_server:
  lif_wineprefix:
  lif_backups:
